<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp QR Login - Guardian</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }
    .container {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 40px;
      text-align: center;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    h1 { font-size: 1.5rem; margin-bottom: 10px; }
    .subtitle { color: #888; margin-bottom: 30px; font-size: 0.9rem; }
    #qr-container {
      background: #fff;
      border-radius: 15px;
      padding: 20px;
      margin: 20px 0;
      min-height: 296px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #qr-code { max-width: 256px; }
    #status {
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      margin-top: 20px;
    }
    .status-waiting { background: #3498db; }
    .status-connected { background: #27ae60; }
    .status-error { background: #e74c3c; }
    .instructions {
      margin-top: 20px;
      font-size: 0.85rem;
      color: #aaa;
      line-height: 1.6;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WhatsApp QR Login</h1>
    <p class="subtitle">WhatsApp Guardian</p>
    
    <div id="qr-container">
      <div class="spinner" id="spinner"></div>
      <img id="qr-code" style="display:none;" alt="QR Code">
    </div>
    
    <div id="status" class="status-waiting">Connecting to WhatsApp...</div>
    
    <div class="instructions">
      <strong>How to connect:</strong><br>
      1. Open WhatsApp<br>
      2. Settings → Linked Devices<br>
      3. Tap "Link a Device"<br>
      4. Scan the QR code
    </div>
  </div>

  <script>
    const socket = io();
    const qrImg = document.getElementById('qr-code');
    const spinner = document.getElementById('spinner');
    const status = document.getElementById('status');

    socket.on('connect', () => {
      console.log('WebSocket connected');
      status.textContent = 'Waiting for QR code...';
    });

    socket.on('qr', (dataUrl) => {
      console.log('QR received');
      spinner.style.display = 'none';
      qrImg.src = dataUrl;
      qrImg.style.display = 'block';
      status.textContent = 'QR code ready - scan now!';
      status.className = 'status-waiting';
    });

    socket.on('connected', (data) => {
      console.log('Connected:', data);
      qrImg.style.display = 'none';
      spinner.style.display = 'none';
      status.textContent = '✓ Successfully connected!';
      status.className = 'status-connected';
      document.getElementById('qr-container').innerHTML = 
        '<div style="font-size:4rem;">✓</div>';
    });

    socket.on('status', (data) => {
      console.log('Status:', data);
      if (data.status === 'connecting') {
        status.textContent = 'Connecting...';
      }
    });

    socket.on('error', (msg) => {
      status.textContent = 'Error: ' + msg;
      status.className = 'status-error';
    });

    socket.on('disconnect', () => {
      status.textContent = 'Connection lost';
      status.className = 'status-error';
    });
  </script>
</body>
</html>
